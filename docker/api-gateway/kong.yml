_format_version: "2.1"
_transform: true

services:
    - name: ms-catalog-service
      url: http://ms-catalog:8009
      routes:
          - name: ms-catalog-categories-route
            paths:
                - /catalog/categories
                - /catalog/categories/
            strip_path: true
            methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            plugins:
                - name: request-transformer
                  config:
                      replace:
                          uri: /api/v1/catalog/categories/
          - name: ms-catalog-items-route
            paths:
                - /catalog/items
                - /catalog/items/
            strip_path: true
            methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            plugins:
                - name: request-transformer
                  config:
                      replace:
                          uri: /api/v1/catalog/items/

    - name: ms-auth-service
      url: http://ms-auth-service:8011
      routes:
          - name: ms-auth-route
            paths:
                - /auth
            strip_path: true
            methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]

    - name: ms-competencies
      url: http://ms-competencies:8010
      routes:
          - name: ms-competencies-route
            paths:
                - /competencies
            strip_path: false
            methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]

    - name: ms-statistics-service
      url: http://ms-statistics:8012
      routes:
          - name: ms-statistics-teams-route
            paths:
                - /statistics/teams
            strip_path: true
            methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            plugins:
                - name: request-transformer
                  config:
                      replace:
                          uri: /api/v1/teams/
          - name: ms-statistics-seasons-route
            paths:
                - /statistics/seasons
            strip_path: true
            methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            plugins:
                - name: request-transformer
                  config:
                      replace:
                          uri: /api/v1/seasons/
          - name: ms-statistics-players-route
            paths:
                - /statistics/players
            strip_path: true
            methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            plugins:
                - name: request-transformer
                  config:
                      replace:
                          uri: /api/v1/players/
          - name: ms-statistics-competitions-route
            paths:
                - /statistics/competitions
            strip_path: true
            methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            plugins:
                - name: request-transformer
                  config:
                      replace:
                          uri: /api/v1/competitions/

plugins:
    - name: cors
      config:
          origins:
              - http://localhost:4200
              - http://localhost:65293
              - http://localhost:8002
              - http://10.0.2.2:8000
              - "*"  # Allow all origins for development
          methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - HEAD
              - OPTIONS
          headers:
              - Accept
              - Authorization
              - Content-Type
              - Origin
              - X-Requested-With
              - Cache-Control
              - Pragma
              - Expires
          exposed_headers:
              - X-Auth-Token
          credentials: true
          max_age: 3600
          preflight_continue: false
