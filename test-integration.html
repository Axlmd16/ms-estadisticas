<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Test API SportBoard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c5aa0; text-align: center; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        .result { margin-top: 10px; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test de API SportBoard</h1>
        
        <div class="test-section">
            <h3>📡 Test de Conectividad</h3>
            <button onclick="testConnectivity()">Probar Conexión</button>
            <div id="connectivity-result"></div>
        </div>

        <div class="test-section">
            <h3>📝 Test de Registro</h3>
            <input type="text" id="username" placeholder="Username" value="testuser123">
            <input type="email" id="email" placeholder="Email" value="test123@example.com">
            <input type="text" id="firstname" placeholder="Nombre" value="Test">
            <input type="text" id="lastname" placeholder="Apellido" value="User">
            <input type="password" id="password" placeholder="Password" value="password123">
            <button onclick="testRegister()">Probar Registro</button>
            <div id="register-result"></div>
        </div>

        <div class="test-section">
            <h3>🔐 Test de Login</h3>
            <input type="email" id="login-email" placeholder="Email" value="test123@example.com">
            <input type="password" id="login-password" placeholder="Password" value="password123">
            <button onclick="testLogin()">Probar Login</button>
            <div id="login-result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/auth/api/v1/auth';

        async function testConnectivity() {
            const resultDiv = document.getElementById('connectivity-result');
            resultDiv.innerHTML = 'Probando...';
            
            try {
                const response = await fetch(`${API_BASE}/`);
                const data = await response.json();
                resultDiv.innerHTML = `<div class="result success">✅ Conexión exitosa!<br><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Error de conexión: ${error.message}</div>`;
            }
        }

        async function testRegister() {
            const resultDiv = document.getElementById('register-result');
            resultDiv.innerHTML = 'Registrando...';
            
            const userData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                firstname: document.getElementById('firstname').value,
                lastname: document.getElementById('lastname').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(`${API_BASE}/register/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="result success">✅ Registro exitoso!<br><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                    // Auto-llenar el login
                    document.getElementById('login-email').value = userData.email;
                    document.getElementById('login-password').value = userData.password;
                } else {
                    resultDiv.innerHTML = `<div class="result error">❌ Error en registro:<br><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testLogin() {
            const resultDiv = document.getElementById('login-result');
            resultDiv.innerHTML = 'Iniciando sesión...';
            
            const loginData = {
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            };

            try {
                const response = await fetch(`${API_BASE}/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginData)
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="result success">✅ Login exitoso!<br><strong>Token Access:</strong> ${data.access.substring(0, 50)}...<br><strong>Token Refresh:</strong> ${data.refresh.substring(0, 50)}...</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="result error">❌ Error en login:<br><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        }

        // Auto-test connectivity al cargar
        window.onload = () => {
            testConnectivity();
        };
    </script>
</body>
</html>
